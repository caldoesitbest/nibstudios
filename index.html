<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Nib Vector Studio: vector design for apparel, logos and print.">
<meta name="theme-color" content="#26272b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath d='M10 1.8 15.6 9.2 12.8 18H7.2L4.4 9.2Z' fill='%234f8dff'/%3E%3C/svg%3E">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>Nib Vector Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Bebas+Neue&family=Caveat:wght@400;700&family=DM+Serif+Display&family=JetBrains+Mono:wght@400;700&family=Lora:wght@400;700&family=Montserrat:wght@400;700;900&family=Oswald:wght@400;700&family=Pacifico&family=Playfair+Display:wght@400;700&family=Roboto:wght@400;500;700;900&display=swap">
<style>
/* Layout: menu bar / control bar / [tool column | document window | panel dock] / status bar.
   Dark-first: the chrome recedes so the artboard is the brightest thing on screen. */
:root {
  --chrome: #26272b;
  --chrome-2: #2f3035;
  --chrome-3: #3a3b41;
  --chrome-4: #45464d;
  --line: #18191c;
  --line-soft: #46474f;
  --text: #e5e5e9;
  --text-dim: #a5a6ae;
  --text-faint: #6f7079;
  --accent: #4f8dff;
  --accent-soft: rgba(79, 141, 255, 0.22);
  --on-accent: #ffffff;
  --paste: #1b1c1f;
  --danger: #ff6b5e;
  --guide: #31c6f2;
  --smart: #ff3fd0;
  --ab-shadow: rgba(0, 0, 0, 0.5);
  --check-a: #ffffff;
  --check-b: #d4d4d8;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --chrome: #e4e4e8; --chrome-2: #efeff2; --chrome-3: #ffffff; --chrome-4: #d8d8de;
    --line: #c2c2ca; --line-soft: #cfd0d7;
    --text: #1d1e22; --text-dim: #54555d; --text-faint: #8c8d95;
    --accent: #2767e0; --accent-soft: rgba(39, 103, 224, 0.16); --on-accent: #ffffff;
    --paste: #c6c7cd; --danger: #d63a2c; --guide: #0aa6d6; --smart: #e0149f;
    --ab-shadow: rgba(0, 0, 0, 0.2);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --chrome: #e4e4e8; --chrome-2: #efeff2; --chrome-3: #ffffff; --chrome-4: #d8d8de;
  --line: #c2c2ca; --line-soft: #cfd0d7;
  --text: #1d1e22; --text-dim: #54555d; --text-faint: #8c8d95;
  --accent: #2767e0; --accent-soft: rgba(39, 103, 224, 0.16); --on-accent: #ffffff;
  --paste: #c6c7cd; --danger: #d63a2c; --guide: #0aa6d6; --smart: #e0149f;
  --ab-shadow: rgba(0, 0, 0, 0.2);
  color-scheme: light;
}

html, body { height: 100%; overflow: hidden; }
body { background: var(--chrome); color: var(--text); font: 12px/1.35 var(--font-ui); -webkit-font-smoothing: antialiased; user-select: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg { display: block; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

#app {
  height: 100%;
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr) 292px;
  grid-template-rows: 30px 38px minmax(0, 1fr) 24px;
  grid-template-areas: "menu menu menu" "ctrl ctrl ctrl" "tools center dock" "status status status";
}
#app.hide-panels { grid-template-columns: 0 minmax(0, 1fr) 0; grid-template-rows: 30px 0 minmax(0, 1fr) 24px; }
#app.hide-panels #toolbar, #app.hide-panels #dock, #app.hide-panels #controlbar { display: none; }

/* ---------- menu bar ---------- */
#menubar { grid-area: menu; display: flex; align-items: stretch; background: var(--chrome); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; font-weight: 600; letter-spacing: 0.02em; color: var(--text); }
.brand svg { width: 18px; height: 18px; color: var(--accent); }
#menus { display: flex; align-items: stretch; min-width: 0; overflow: hidden; }
.mtop { padding: 0 9px; display: flex; align-items: center; border: 0; background: none; border-radius: 0; }
.mtop:hover, .mtop.open { background: var(--chrome-3); }
.mb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--text-dim); white-space: nowrap; overflow: hidden; }
.mb-right .lib-state { font-size: 11px; }
.icon-btn { width: 26px; height: 26px; display: inline-grid; place-items: center; border: 0; background: none; border-radius: 4px; color: var(--text-dim); padding: 0; }
.icon-btn:hover { background: var(--chrome-3); color: var(--text); }
.icon-btn.on { background: var(--accent-soft); color: var(--accent); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:disabled { opacity: 0.35; }

/* dropdown + context menus */
.menu { position: fixed; z-index: 80; min-width: 220px; background: var(--chrome-2); border: 1px solid var(--line); box-shadow: 0 10px 28px rgba(0,0,0,.38); padding: 4px 0; border-radius: 4px; }
.menu .mi { display: flex; align-items: center; gap: 10px; padding: 4px 14px 4px 26px; position: relative; white-space: nowrap; }
.menu .mi:hover:not(.dis), .menu .mi.hl:not(.dis) { background: var(--accent); color: var(--on-accent); }
.menu .mi.dis { color: var(--text-faint); }
.menu .mi .k { margin-left: auto; padding-left: 24px; color: var(--text-dim); font-size: 11px; }
.menu .mi:hover:not(.dis) .k { color: inherit; opacity: 0.85; }
.menu .mi .chk { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); }
.menu .mi .sub { margin-left: auto; padding-left: 16px; }
.menu .sep { height: 1px; background: var(--line-soft); margin: 4px 0; }

/* ---------- control bar ---------- */
#controlbar { grid-area: ctrl; display: flex; align-items: center; gap: 10px; padding: 0 10px; background: var(--chrome-2); border-bottom: 1px solid var(--line); min-width: 0; overflow: hidden; white-space: nowrap; }
#controlbar .kind { font-weight: 600; min-width: 92px; color: var(--text); }
#controlbar .grp { display: flex; align-items: center; gap: 6px; }
#controlbar .vsep { width: 1px; align-self: stretch; margin: 7px 2px; background: var(--line-soft); }
#controlbar .lbl { color: var(--text-dim); }
#controlbar .spacer { flex: 1; }
#controlbar .iconrow { flex-wrap: nowrap; }

/* ---------- tool column ---------- */
#toolbar { grid-area: tools; background: var(--chrome-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 6px 0; gap: 1px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
#toolbar::-webkit-scrollbar { display: none; }
.tool { width: 34px; height: 30px; border: 0; background: none; color: var(--text-dim); display: grid; place-items: center; position: relative; border-radius: 4px; padding: 0; flex: none; }
.tool svg { width: 19px; height: 19px; }
.tool:hover { background: var(--chrome-3); color: var(--text); }
.tool.on { background: var(--chrome-4); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-soft); }
.tool.more::after { content: ""; position: absolute; right: 3px; bottom: 3px; border: 3px solid transparent; border-right-color: currentColor; border-bottom-color: currentColor; opacity: .7; }
.tsep { width: 26px; height: 1px; background: var(--line-soft); margin: 4px 0; flex: none; }
.flyout { position: fixed; z-index: 80; background: var(--chrome-2); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.35); padding: 4px; border-radius: 4px; display: flex; flex-direction: column; gap: 1px; }
.flyout button { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 4px 12px 4px 6px; border-radius: 3px; text-align: left; }
.flyout button svg { width: 18px; height: 18px; color: var(--text-dim); }
.flyout button:hover { background: var(--accent); color: var(--on-accent); }
.flyout button:hover svg { color: var(--on-accent); }
.flyout .k { margin-left: auto; padding-left: 18px; opacity: .7; font-size: 11px; }

/* fill / stroke proxy */
.fs { position: relative; width: 40px; height: 40px; margin-top: 6px; flex: none; }
.fs .sw { position: absolute; width: 24px; height: 24px; border: 1px solid var(--line); padding: 0; }
.fs .sw.fill { left: 0; top: 0; }
.fs .sw.stroke { right: 0; bottom: 0; }
.fs .sw.stroke .hole { position: absolute; inset: 5px; background: var(--chrome-2); border: 1px solid var(--line); }
.fs .sw.front { z-index: 2; box-shadow: 0 0 0 1px var(--chrome-2); }
.fs .swap, .fs .dflt { position: absolute; width: 12px; height: 12px; border: 0; padding: 0; background: none; color: var(--text-dim); }
.fs .swap { right: -2px; top: -3px; }
.fs .dflt { left: -2px; bottom: -3px; }
.fs .swap:hover, .fs .dflt:hover { color: var(--text); }
.paintmodes { display: flex; gap: 2px; margin-top: 6px; flex: none; }
.paintmodes button { width: 12px; height: 12px; padding: 0; border: 1px solid var(--line); }
.paintmodes button.on { outline: 1px solid var(--accent); outline-offset: 1px; }

/* paint swatch rendering (shared) */
.paint { background-color: transparent; }
.paint.none { background: var(--check-a) !important; position: relative; overflow: hidden; }
.paint.none::after { content: ""; position: absolute; left: -20%; top: 50%; width: 140%; height: 2px; background: #e5281e; transform: rotate(-45deg); }
.paint.mixed { background: var(--chrome-4) !important; position: relative; }
.paint.mixed::after { content: "?"; position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; color: var(--text); font-size: 11px; }
.checker { background-image: linear-gradient(45deg, var(--check-b) 25%, transparent 25%, transparent 75%, var(--check-b) 75%), linear-gradient(45deg, var(--check-b) 25%, var(--check-a) 25%, var(--check-a) 75%, var(--check-b) 75%); background-size: 8px 8px; background-position: 0 0, 4px 4px; }

/* ---------- document window ---------- */
#center { grid-area: center; display: grid; grid-template-rows: 26px minmax(0, 1fr); min-width: 0; min-height: 0; background: var(--paste); }
#tabs { display: flex; align-items: flex-end; background: var(--chrome); border-bottom: 1px solid var(--line); padding-left: 4px; overflow: hidden; }
.doctab { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 12px; background: var(--chrome-2); border: 1px solid var(--line); border-bottom: 0; border-radius: 3px 3px 0 0; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.doctab .meta { color: var(--text-dim); }
.doctab .dirty { color: var(--accent); }
#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#stage.rulers #viewport { left: 18px; top: 18px; }
#viewport { position: absolute; inset: 0; overflow: hidden; touch-action: none; }
#viewport canvas { position: absolute; left: 0; top: 0; }
#cvOver { touch-action: none; }
.ruler { position: absolute; background: var(--chrome-2); display: none; }
#stage.rulers .ruler { display: block; }
#rulerTop { left: 18px; top: 0; height: 18px; right: 0; border-bottom: 1px solid var(--line); }
#rulerLeft { left: 0; top: 18px; width: 18px; bottom: 0; border-right: 1px solid var(--line); }
#rulerCorner { left: 0; top: 0; width: 18px; height: 18px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
#textEditor { position: absolute; left: 0; top: 0; transform-origin: 0 0; margin: 0; padding: 0; border: 0; outline: 1px dashed var(--accent); background: transparent; resize: none; overflow: hidden; white-space: pre; z-index: 5; caret-color: var(--accent); }

/* ---------- dock ---------- */
#dock { grid-area: dock; background: var(--chrome-2); border-left: 1px solid var(--line); display: grid; grid-template-rows: minmax(120px, var(--dock-split, 58%)) 5px minmax(90px, 1fr); min-height: 0; min-width: 0; }
.dgroup { display: grid; grid-template-rows: 28px minmax(0, 1fr); min-height: 0; }
.dtabs { display: flex; align-items: stretch; background: var(--chrome); border-bottom: 1px solid var(--line); }
.dtab { border: 0; background: none; padding: 0 12px; color: var(--text-dim); border-right: 1px solid var(--line); }
.dtab.on { background: var(--chrome-2); color: var(--text); box-shadow: inset 0 2px 0 var(--accent); }
.dbody { overflow-y: auto; overflow-x: hidden; min-height: 0; }
.dresize { cursor: row-resize; background: var(--chrome); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }

.sec { border-bottom: 1px solid var(--line); }
.sec-h { display: flex; align-items: center; gap: 6px; padding: 8px 10px 6px; font-weight: 600; color: var(--text); }
.sec-h .chev { width: 12px; height: 12px; color: var(--text-dim); transition: transform .12s; }
.sec.closed .chev { transform: rotate(-90deg); }
.sec.closed .sec-b { display: none; }
.sec-b { padding: 2px 10px 10px; display: flex; flex-direction: column; gap: 7px; }
.row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.row > .grow { flex: 1; min-width: 0; }
.cap { color: var(--text-dim); font-size: 11px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
.hint { color: var(--text-faint); font-size: 11px; line-height: 1.45; }

/* fields */
.fld { display: flex; align-items: center; height: 24px; background: var(--chrome-3); border: 1px solid var(--line); border-radius: 3px; min-width: 0; }
.fld:focus-within { border-color: var(--accent); }
.fld .fl { padding: 0 2px 0 6px; color: var(--text-dim); cursor: ew-resize; font-size: 11px; min-width: 14px; }
.fld input { flex: 1; min-width: 0; width: 100%; background: none; border: 0; outline: 0; padding: 0 6px 0 4px; height: 100%; font-family: var(--font-num); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.fld .unit { padding-right: 6px; color: var(--text-faint); font-size: 10.5px; }
.fld.w60 { width: 60px; flex: none; } .fld.w72 { width: 72px; flex: none; } .fld.w84 { width: 84px; flex: none; } .fld.w96 { width: 96px; flex: none; }
select.sel, input.txt { height: 24px; background: var(--chrome-3); border: 1px solid var(--line); border-radius: 3px; padding: 0 6px; min-width: 0; outline: 0; }
select.sel:focus, input.txt:focus { border-color: var(--accent); }
.btn { height: 26px; padding: 0 12px; border: 1px solid var(--line-soft); background: var(--chrome-3); border-radius: 4px; color: var(--text); white-space: nowrap; }
.btn:hover { background: var(--chrome-4); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { height: 22px; padding: 0 8px; font-size: 11px; }
.btn:disabled { opacity: .45; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: var(--chrome-3); }
.seg button { border: 0; background: none; height: 22px; min-width: 26px; padding: 0 6px; display: grid; place-items: center; color: var(--text-dim); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button svg { width: 16px; height: 16px; }
.seg button.on { background: var(--accent-soft); color: var(--accent); }
.seg button:hover:not(.on) { color: var(--text); background: var(--chrome-4); }
.chk { display: flex; align-items: center; gap: 6px; }
.chk input { accent-color: var(--accent); margin: 0; }
.swbtn { width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 3px; padding: 0; flex: none; position: relative; }
.swbtn.strokeish::after { content: ""; position: absolute; inset: 5px; background: var(--chrome-2); border: 1px solid var(--line); }
.refpt { display: grid; grid-template-columns: repeat(3, 8px); gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 3px; background: var(--chrome-3); }
.refpt button { width: 8px; height: 8px; padding: 0; border: 1px solid var(--text-faint); background: none; }
.refpt button.on { background: var(--text); border-color: var(--text); }
.iconrow { display: flex; flex-wrap: wrap; gap: 2px; }

/* layers */
.lyr-list { padding: 2px 0; }
.lrow { display: flex; align-items: center; height: 24px; gap: 2px; padding-right: 6px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); position: relative; }
.lrow:hover { background: var(--chrome-3); }
.lrow.active { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.lrow.drop-above::before, .lrow.drop-below::after { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: var(--accent); }
.lrow.drop-above::before { top: -1px; } .lrow.drop-below::after { bottom: -1px; }
.lrow.drop-into { box-shadow: inset 0 0 0 2px var(--accent); }
.lrow .tg { width: 22px; height: 22px; border: 0; background: none; padding: 0; display: grid; place-items: center; color: var(--text-dim); flex: none; }
.lrow .tg svg { width: 14px; height: 14px; }
.lrow .tg.off { color: var(--text-faint); opacity: .55; }
.lrow .tw { width: 14px; height: 22px; border: 0; background: none; padding: 0; display: grid; place-items: center; color: var(--text-dim); flex: none; }
.lrow .tw svg { width: 10px; height: 10px; transition: transform .1s; }
.lrow .tw.open svg { transform: rotate(90deg); }
.lrow .chip { width: 3px; height: 16px; border-radius: 1px; flex: none; margin-right: 4px; }
.lrow .thumb { width: 16px; height: 16px; flex: none; border: 1px solid var(--line); margin-right: 5px; border-radius: 2px; }
.lrow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow.layer .nm { font-weight: 600; }
.lrow .nm input { width: 100%; height: 20px; background: var(--chrome-3); border: 1px solid var(--accent); padding: 0 4px; outline: 0; }
.lrow .tgt { width: 16px; height: 16px; flex: none; display: grid; place-items: center; }
.lrow .tgt i { width: 8px; height: 8px; border: 1.5px solid var(--text-faint); border-radius: 50%; }
.lrow .tgt i.sel { border-radius: 1px; border-color: transparent; }
.lmore { display: block; margin: 4px 0 6px; border: 0; background: none; color: var(--accent); font-size: 11px; padding: 2px 4px; text-align: left; }
.lmore:hover { text-decoration: underline; }
.lfoot { display: flex; align-items: center; gap: 2px; padding: 3px 6px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--chrome-2); }
.lfoot .cnt { margin-right: auto; color: var(--text-dim); }

/* swatches */
.swgrid { display: grid; grid-template-columns: repeat(auto-fill, 24px); gap: 4px; }
.swgrid button { width: 24px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 2px; }
.swgrid button:hover { outline: 1px solid var(--text); outline-offset: 1px; }

/* ---------- status bar ---------- */
#statusbar { grid-area: status; display: flex; align-items: center; gap: 12px; padding: 0 8px; background: var(--chrome); border-top: 1px solid var(--line); color: var(--text-dim); white-space: nowrap; overflow: hidden; min-width: 0; }
#statusbar .zoom { display: flex; align-items: center; gap: 2px; }
#statusbar .zoom input { width: 62px; height: 18px; background: var(--chrome-3); border: 1px solid var(--line); border-radius: 2px; padding: 0 4px; font-family: var(--font-num); font-size: 11px; outline: 0; color: var(--text); }
#statusbar select { height: 18px; background: var(--chrome-3); border: 1px solid var(--line); border-radius: 2px; font-size: 11px; max-width: 160px; }
#statusbar .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#statusbar .xy { font-family: var(--font-num); font-size: 11px; }

/* ---------- popovers & dialogs ---------- */
.pop { position: fixed; z-index: 82; width: 276px; background: var(--chrome-2); border: 1px solid var(--line); box-shadow: 0 14px 36px rgba(0,0,0,.42); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.pop-h { display: flex; align-items: center; justify-content: space-between; font-weight: 600; }
.sv { position: relative; height: 150px; border-radius: 3px; overflow: hidden; cursor: crosshair; touch-action: none; }
.sv canvas { width: 100%; height: 100%; display: block; }
.knob { position: absolute; width: 12px; height: 12px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.5); transform: translate(-50%, -50%); pointer-events: none; }
.slider { position: relative; height: 12px; border-radius: 6px; cursor: pointer; touch-action: none; }
.slider .knob { top: 50%; width: 14px; height: 14px; }
.hue { background: linear-gradient(90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
.gbar { position: relative; height: 18px; border-radius: 3px; border: 1px solid var(--line); cursor: copy; }
.gstops { position: relative; height: 14px; margin: 0 0 2px; }
.gstop { position: absolute; top: 0; width: 12px; height: 12px; transform: translateX(-50%); border: 2px solid var(--chrome-4); border-radius: 2px 2px 6px 6px; box-shadow: 0 0 0 1px var(--line); cursor: ew-resize; touch-action: none; }
.gstop.on { border-color: var(--accent); }
.cfields { display: grid; grid-template-columns: 74px repeat(4, minmax(0, 1fr)); gap: 3px; }
.cfields .fld .fl { padding: 0 0 0 4px; }
.cfields .fld input { padding: 0 3px; }
.cpsw { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.cpsw button { aspect-ratio: 1; padding: 0; border: 1px solid var(--line); border-radius: 2px; }

function aiHelp(kind) {

    : 'This is an older PostScript-style Illustrator or EPS file, which Nib cannot read.';
  openDialog({
    title: 'This file needs a quick re-save', body: [
      h('p', null, why),
      h('p', null, 'If you have access to Illustrator (or a friend does), any of these makes it open here with layers intact:'),
      h('ul', { class: 'hint', style: { margin: '0', paddingLeft: '18px', lineHeight: '1.6' } },
        h('li', null, 'File › Save As › Adobe Illustrator, and tick “Create PDF Compatible File”.'),
        h('li', null, 'Or File › Save As › Adobe PDF (keep “Preserve Illustrator Editing Capabilities” on).'),
        h('li', null, 'Or File › Export › SVG.')),

}

async function openAIFile(f) {
  const go = async () => {
    const busy = showBusy('Opening ' + f.name, 'Loading the Illustrator reader…');
    try {
      const res = await readAI(f, (n, t) => busy.set(`Converting artboard ${n} of ${t}…`));
      if (!res) return;
      doc = newDocModel(f.name.replace(/\.(ai|ait|pdf)$/i, ''), res.pages[0].w, res.pages[0].h, 'in');
      doc.artboards = res.pages.map((p, i) => ({ name: `Artboard ${i + 1}`, x: p.x, y: 0, w: p.w, h: p.h }));
      doc.images = res.images;
      project.clear();
      if (!res.buckets.length) newLayer('Layer 1');
      for (const b of res.buckets) {
        const L = newLayer(b.name);
        L.addChildren(b.group.removeChildren());
        L.visible = b.visible;

      doc.libId = null;
      afterLoad();
      S.dirty = true; updateStatus();
      const w = [...res.warnings];
      toast(`Opened ${f.name}: ${res.count} objects on ${res.buckets.length || 1} layer${res.buckets.length === 1 ? '' : 's'}. Press Ctrl+S to save it as a Nib project.` + (w.length ? ' ' + w.join(' ') : ''), 7000);
    } catch (e) {

}
async function placeAIFile(f, at) {
  const busy = showBusy('Placing ' + f.name, 'Loading the Illustrator reader…');
  try {
    const res = await readAI(f, (n, t) => busy.set(`Converting artboard ${n} of ${t}…`));
    if (!res) return;
    Object.assign(doc.images, res.images);
    const g = new paper.Group({ insert: false });
    for (const b of res.buckets) { const lg = b.group; lg.name = b.name; lg.visible = b.visible; g.addChild(lg); }
    if (g.children.length === 1) { const only = g.firstChild; g.addChildren(only.removeChildren()); only.remove(); }
    placeNew(g);
    g.name = f.name.replace(/\.(ai|ait|pdf)$/i, '');
    g.position = at || view.center;
    setSelection([g]); commit('Place');
  } catch (e) { console.error(e); toast('That file could not be placed. ' + friendlyError(e), 6000); }
  finally { busy.close(); }
}

/* ---------------- more pathfinder ---------------- */
function pathfinderExtra(op) {
  const items = selItems().filter(isPathLike).sort(zCmp);
  if (items.length < 2) return toast('Select two or more shapes.');
  const opt = { insert: false };
  const out = [];
  if (op === 'trim' || op === 'merge') {
    let above = null;
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      let res = above ? it.subtract(above, opt) : it.clone(opt);
      res.strokeColor = null;
      above = above ? above.unite(it, opt) : it.clone(opt);
      if (isEmptyPath(res)) continue;
      out.unshift(res);
    }
    if (op === 'merge') {
      const byColor = new Map();
      for (const r of out) { const k = JSON.stringify(paintFromPaper(r.fillColor)); byColor.set(k, (byColor.get(k) || []).concat([r])); }
      out.length = 0;
      for (const group of byColor.values()) out.push(group.slice(1).reduce((a, b) => a.unite(b, opt), group[0]));
    }
  } else if (op === 'crop') {
    const top = items[items.length - 1];
    for (const it of items.slice(0, -1)) { const r = it.intersect(top, opt); if (!isEmptyPath(r)) out.push(r); }
  }
  const g = new paper.Group({ insert: false });
  g.insertAbove(items[items.length - 1]);
  out.forEach(r => { if (r._data) { delete r._data.live; delete r._data.shape; delete r._data.angle; } g.addChild(r); });
  items.forEach(it => it.remove());
  setSelection([g]); commit({ trim: 'Trim', merge: 'Merge', crop: 'Crop' }[op]);
}

/* ---------------- starter templates ---------------- */
function teeFlat(back) {
  const g = new paper.Group({ insert: false });
  const ink = paperColor(C(26, 26, 30, 1));
  const half = new paper.Path({ insert: false });
  half.add(new paper.Segment(P(0, back ? 10 : 30), null, P(22, 0)));
  half.add(new paper.Segment(P(40, 0), back ? P(-14, 6) : P(-6, 14), null));
  half.add(P(100, 16), P(150, 86));
  half.add(new paper.Segment(P(126, 104), null, P(-10, -4)));
  half.add(new paper.Segment(P(96, 76), P(6, 10), null));
  half.add(P(100, 276), P(0, 278));
  const other = half.clone({ insert: false }); other.transform(new paper.Matrix(-1, 0, 0, 1, 0, 0));
  half.join(other, 0.01);
  half.fillColor = paperColor(C(255, 255, 255, 1)); half.strokeColor = ink.clone(); half.strokeWidth = 1.5; half.strokeJoin = 'round';
  half.name = back ? 'Back body' : 'Front body';
  g.addChild(half);
  const rib = new paper.Path({ insert: false });
  rib.add(new paper.Segment(P(0, back ? 19 : 40), null, P(24, 0)));
  rib.add(new paper.Segment(P(48, 3), back ? P(-15, 7) : P(-8, 15), null));
  const ribL = rib.clone({ insert: false }); ribL.transform(new paper.Matrix(-1, 0, 0, 1, 0, 0));
  rib.join(ribL, 0.01);
  rib.strokeColor = ink.clone(); rib.strokeWidth = 1.2; rib.name = 'Collar rib';
  g.addChild(rib);
  const stitch = (a, b) => { const s = new paper.Path.Line({ from: a, to: b, insert: false }); s.strokeColor = ink.clone(); s.strokeWidth = 0.75; s.dashArray = [4, 3]; s.name = 'Stitch'; g.addChild(s); };
  stitch(P(-97, 266), P(97, 266));
  stitch(P(144.6, 78.8), P(120.6, 96.8)); stitch(P(-144.6, 78.8), P(-120.6, 96.8));
  const ribStitch = rib.clone({ insert: false }); ribStitch.translate(P(0, 4)); ribStitch.strokeWidth = 0.75; ribStitch.dashArray = [4, 3]; ribStitch.name = 'Stitch'; g.addChild(ribStitch);
  g.name = back ? 'Tee back' : 'Tee front';
  return g;
}
function placeTemplateText(L, content, x, y, size, opts = {}) {
  const t = new paper.PointText({ insert: false });
  L.addChild(t);
  t.point = P(x, y); t.content = content;
  t.fontFamily = fontCSS(opts.font || 'Montserrat'); t.fontSize = size; t.fontWeight = opts.weight || 'normal';
  t.justification = opts.just || 'left';
  t.fillColor = paperColor(opts.color || C(40, 40, 46, 1));
  return t;
}

/* ============================================================

const homeEl = h('div', { id: 'home', class: 'home', hidden: true, role: 'dialog', 'aria-label': 'Start screen' });
document.body.append(homeEl);
const homeVisible = () => !homeEl.hidden;
let homeQuery = '';
function showHome() { closeFloating(); if (dialogOpen && !dialogOpen.locked) dialogOpen.close(); if (S.editingText) commitTextEdit(); homeEl.hidden = false; renderHome(); }
function hideHome() { if (homeEl.hidden) return; homeEl.hidden = true; requestDraw(); resizeCanvases(); }
function relTime(t) {
  if (!t) return '';
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  if (s < 172800) return 'yesterday';
  return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: new Date(t).getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
}
const TEE_ICON = '<svg viewBox="-160 -10 320 300" aria-hidden="true"><path d="M0 30C22 30 34 16 40 0L100 16L150 86L126 104C116 100 104 88 96 76L100 276L0 278L-100 276L-96 76C-104 88-116 100-126 104L-150 86L-100 16L-40 0C-34 16-22 30 0 30Z" fill="#fff" stroke="#24252a" stroke-width="7" stroke-linejoin="round"/><path d="M-97 262H97" stroke="#24252a" stroke-width="4" stroke-dasharray="12 9"/></svg>';

async function renderHome() {
